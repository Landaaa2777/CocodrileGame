<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa del cocodrilo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: linear-gradient(#78c2ff, #ffc2db); }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
// Vista previa APROXIMADA de escenas/cocodrilo.tscn (no es el render de Godot).
// Sirve para revisar proporciones y encuadre sin tener Godot instalado.
// Parámetros de URL: ?w=720&h=1280&boca=abierta|cerrada
import * as THREE from "three";

const parametros = new URLSearchParams(location.search);
const ancho = parseInt(parametros.get("w") || "720");
const alto = parseInt(parametros.get("h") || "1280");
const escena = await (await fetch("./escena.json")).json();
const cargador = new THREE.TextureLoader();
const textura = (n, rx = 1, ry = 1) => {
  const t = cargador.load(`../../assets/texturas/${n}.png`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace;
  return t;
};
const escalones = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1);
escalones.needsUpdate = true;
escalones.minFilter = escalones.magFilter = THREE.NearestFilter;
const toon = (opciones) => new THREE.MeshToonMaterial({ gradientMap: escalones, ...opciones });
const materiales = {
  escamas: toon({ map: textura("escamas_albedo", 3, 2), normalMap: textura("escamas_normal", 3, 2) }),
  parpado: toon({ map: textura("escamas_albedo") }),
  panza: toon({ color: new THREE.Color(0.86, 0.95, 0.56) }),
  encia: toon({ map: textura("encia_albedo") }),
  lengua: toon({ map: textura("lengua_albedo") }),
  diente: toon({ map: textura("dientes_albedo") }),
  negro: toon({ color: new THREE.Color(0.12, 0.15, 0.1) }),
  plataforma: toon({ color: new THREE.Color(0.8, 0.74, 1.0) }),
  ojo: new THREE.ShaderMaterial({
    vertexShader: `varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 p; void main(){ vec3 n = normalize(p); float f = smoothstep(0.05,0.3,n.z);
      float pupila = (1.0 - smoothstep(0.40,0.44, length(n.xy)/1.0)) * f;
      vec3 c = mix(vec3(1.0,1.0,0.97), vec3(0.03), pupila);
      float b = 1.0 - smoothstep(0.11,0.15, distance(n.xy, vec2(-0.3,0.36)));
      gl_FragColor = vec4(mix(c, vec3(1.0), b*f), 1.0); }`,
  }),
};
const contorno = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { grosor: { value: 0.0042 } },
  vertexShader: `uniform float grosor; void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vec3 wn = normalize(mat3(transpose(inverse(modelMatrix))) * normal);
    wp.xyz += wn * grosor * length(cameraPosition - wp.xyz);
    gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(0.1,0.13,0.08,1.0); }`,
});
const sinContorno = new Set(["parpado", "negro"]);

const raiz = new THREE.Group();
for (const o of escena.objetos) {
  if (!o.visible) continue;
  const p = o.parametros;
  let geo;
  if (o.tipo === "SphereMesh") {
    if (p.is_hemisphere) {
      geo = new THREE.SphereGeometry(p.radius, p.radial_segments, p.rings, 0, Math.PI * 2, 0, Math.PI / 2);
      geo.scale(1, p.height / p.radius, 1);
    } else {
      geo = new THREE.SphereGeometry(p.radius, p.radial_segments, p.rings);
      geo.scale(1, p.height / (2 * p.radius), 1);
    }
  } else if (o.tipo === "CapsuleMesh") {
    geo = new THREE.CapsuleGeometry(p.radius, Math.max(0.001, p.height - 2 * p.radius), 6, p.radial_segments);
  } else continue;
  const m = new THREE.Matrix4().fromArray(o.matriz).transpose(); // la matriz llega por filas
  const malla = new THREE.Mesh(geo, materiales[o.material]);
  malla.matrixAutoUpdate = false; malla.matrix.copy(m);
  raiz.add(malla);
  if (!sinContorno.has(o.material)) {
    const borde = new THREE.Mesh(geo, contorno);
    borde.matrixAutoUpdate = false; borde.matrix.copy(m);
    raiz.add(borde);
  }
}
const mundo = new THREE.Scene();
mundo.add(raiz);
mundo.add(new THREE.AmbientLight(new THREE.Color(0.66, 0.68, 0.92), 0.9));
const sol = new THREE.DirectionalLight(0xffffff, 2.2);
sol.position.set(3, 6, 5);
mundo.add(sol);

// Encuadre: mismo cálculo que scripts/camara.gd
const objetivo = new THREE.Vector3(...JSON.parse(parametros.get("objetivo") || "[0, 0.95, 0.75]"));
const distancia = parseFloat(parametros.get("distancia") || "7.2");
const elevacion = THREE.MathUtils.degToRad(parseFloat(parametros.get("elevacion") || "26"));
const rumbo = THREE.MathUtils.degToRad(parseFloat(parametros.get("rumbo") || "0"));
const anchoVisible = parseFloat(parametros.get("ancho") || "3.4");
const altoVisible = parseFloat(parametros.get("alto") || "4.2");
const aspecto = ancho / alto;
const fovAlto = 2 * Math.atan(altoVisible * 0.5 / distancia);
const fovAncho = 2 * Math.atan(anchoVisible * 0.5 / distancia / aspecto);
const camara = new THREE.PerspectiveCamera(THREE.MathUtils.radToDeg(Math.max(fovAlto, fovAncho)), aspecto, 0.1, 100);
camara.position.copy(objetivo).add(new THREE.Vector3(Math.sin(rumbo) * Math.cos(elevacion), Math.sin(elevacion),
  Math.cos(rumbo) * Math.cos(elevacion)).multiplyScalar(distancia));
camara.lookAt(objetivo);

const render = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
render.setSize(ancho, alto);
document.body.appendChild(render.domElement);
THREE.DefaultLoadingManager.onLoad = () => { render.render(mundo, camara); window.listo = true; };
render.render(mundo, camara);
</script>
</body>
</html>
